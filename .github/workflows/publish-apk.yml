name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Validate and Publish Prebuilt Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate prebuilt APK and SHA-256 checksum
        id: validate
        run: |
          set -euo pipefail

          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Missing or empty APK at $APK_PATH"
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ] || [ ! -s "$SHA_PATH" ]; then
            echo "::error::Missing or empty checksum file at $SHA_PATH"
            exit 1
          fi

          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)
          unzip -tq "$APK_PATH"

          APK_BYTES=$(stat -c '%s' "$APK_PATH")
          APK_HUMAN=$(numfmt --to=iec-i --suffix=B "$APK_BYTES" 2>/dev/null || echo "${APK_BYTES} bytes")
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')

          echo "apk_bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"
          echo "apk_human=$APK_HUMAN" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          APK_SHA256="${{ steps.validate.outputs.apk_sha256 }}"
          APK_BYTES="${{ steps.validate.outputs.apk_bytes }}"
          APK_HUMAN="${{ steps.validate.outputs.apk_human }}"

          gh release create "$RELEASE_TAG" \
            "apk-distribution/app-debug.apk#app-debug.apk" \
            --target "${{ github.sha }}" \
            --title "Debug APK Build #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Prebuilt Android Debug APK compiled in Google AI Studio.

          - **Asset:** \`app-debug.apk\`
          - **Size:** ${APK_HUMAN} (${APK_BYTES} bytes)
          - **SHA-256:** \`${APK_SHA256}\`" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          APK_BYTES: ${{ steps.validate.outputs.apk_bytes }}
          APK_HUMAN: ${{ steps.validate.outputs.apk_human }}
          APK_SHA256: ${{ steps.validate.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          {
            echo "## Prebuilt Debug APK Published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Release Tag | \`${RELEASE_TAG}\` |"
            echo "| APK Size | ${APK_HUMAN} (${APK_BYTES} bytes) |"
            echo "| SHA-256 | \`${APK_SHA256}\` |"
            echo "| GitHub Release | ${RELEASE_URL} |"
            echo "| Direct Latest Download | ${DIRECT_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
